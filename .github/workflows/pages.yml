# Publishes the site to GitHub Pages on every push to main (free, no deploy limit).
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Combine strings/ into strings.json
        run: node build.js
      - name: Stamp this version on the app files, so a normal reload picks up the new version
        run: sed -i -E 's#(href="styles\.css|src="models\.js|src="app\.js)"#\1?v='"${GITHUB_SHA::8}"'"#' index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
